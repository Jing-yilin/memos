syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service StickerService {
  // ListStickerPacks lists all sticker packs.
  rpc ListStickerPacks(ListStickerPacksRequest) returns (ListStickerPacksResponse) {
    option (google.api.http) = {get: "/api/v1/sticker-packs"};
  }
  // GetStickerPack returns a sticker pack by name.
  rpc GetStickerPack(GetStickerPackRequest) returns (StickerPack) {
    option (google.api.http) = {get: "/api/v1/{name=sticker-packs/*}"};
    option (google.api.method_signature) = "name";
  }
  // CreateStickerPack creates a new sticker pack.
  rpc CreateStickerPack(CreateStickerPackRequest) returns (StickerPack) {
    option (google.api.http) = {
      post: "/api/v1/sticker-packs"
      body: "sticker_pack"
    };
    option (google.api.method_signature) = "sticker_pack";
  }
  // UpdateStickerPack updates a sticker pack.
  rpc UpdateStickerPack(UpdateStickerPackRequest) returns (StickerPack) {
    option (google.api.http) = {
      patch: "/api/v1/{sticker_pack.name=sticker-packs/*}"
      body: "sticker_pack"
    };
    option (google.api.method_signature) = "sticker_pack,update_mask";
  }
  // DeleteStickerPack deletes a sticker pack by name.
  rpc DeleteStickerPack(DeleteStickerPackRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=sticker-packs/*}"};
    option (google.api.method_signature) = "name";
  }
  // CreateSticker creates a new sticker in a pack.
  rpc CreateSticker(CreateStickerRequest) returns (Sticker) {
    option (google.api.http) = {
      post: "/api/v1/{parent=sticker-packs/*}/stickers"
      body: "sticker"
    };
    option (google.api.method_signature) = "parent,sticker";
  }
  // DeleteSticker deletes a sticker by name.
  rpc DeleteSticker(DeleteStickerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=sticker-packs/*/stickers/*}"};
    option (google.api.method_signature) = "name";
  }
}

message StickerPack {
  option (google.api.resource) = {
    type: "memos.api.v1/StickerPack"
    pattern: "sticker-packs/{sticker_pack}"
    singular: "stickerPack"
    plural: "stickerPacks"
  };

  // The name of the sticker pack.
  // Format: sticker-packs/{sticker_pack}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The display name of the sticker pack.
  string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The description of the sticker pack.
  string description = 5 [(google.api.field_behavior) = OPTIONAL];

  // Whether the sticker pack is enabled.
  bool enabled = 6;

  // Output only. The stickers in this pack.
  repeated Sticker stickers = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Sticker {
  option (google.api.resource) = {
    type: "memos.api.v1/Sticker"
    pattern: "sticker-packs/{sticker_pack}/stickers/{sticker}"
    singular: "sticker"
    plural: "stickers"
  };

  // The name of the sticker.
  // Format: sticker-packs/{sticker_pack}/stickers/{sticker}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The display name of the sticker.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // The image data of the sticker.
  // Either content or external_link must be provided.
  bytes content = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The external link of the sticker image.
  string external_link = 5 [(google.api.field_behavior) = OPTIONAL];

  // The MIME type of the sticker (e.g., image/png, image/webp, image/gif).
  string type = 6 [(google.api.field_behavior) = REQUIRED];

  // Output only. The size of the sticker in bytes.
  int64 size = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Tags for categorizing the sticker.
  repeated string tags = 8 [(google.api.field_behavior) = OPTIONAL];
}

message ListStickerPacksRequest {}

message ListStickerPacksResponse {
  repeated StickerPack sticker_packs = 1;
}

message GetStickerPackRequest {
  // The name of the sticker pack to retrieve.
  // Format: sticker-packs/{sticker_pack}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/StickerPack"}
  ];
}

message CreateStickerPackRequest {
  // The sticker pack to create.
  StickerPack sticker_pack = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateStickerPackRequest {
  // The sticker pack to update.
  StickerPack sticker_pack = 1 [(google.api.field_behavior) = REQUIRED];

  // The update mask applies to the sticker pack.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteStickerPackRequest {
  // The name of the sticker pack to delete.
  // Format: sticker-packs/{sticker_pack}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/StickerPack"}
  ];
}

message CreateStickerRequest {
  // The parent sticker pack.
  // Format: sticker-packs/{sticker_pack}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/StickerPack"}
  ];

  // The sticker to create.
  Sticker sticker = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteStickerRequest {
  // The name of the sticker to delete.
  // Format: sticker-packs/{sticker_pack}/stickers/{sticker}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Sticker"}
  ];
}
